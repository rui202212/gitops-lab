apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: concrete
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/rui202212/gitops-lab.git
    targetRevision: dev
    path: concrete-calculator/helm/concrete-chart
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true